services:
  - type: web
    name: fine-dine-knl
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: knl-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/knl_restaurant.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@finedineknl.com
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: "9490012345"
      - key: CLIENT_URL
        sync: false
