services:
  - type: web
    name: fine-dine-knl-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@finedineknl.com
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: "9490012345"
      - key: CLIENT_URL
        value: https://fine-dine-knl-restaurant.vercel.app
      - key: CORS_ORIGIN
        value: https://fine-dine-knl-restaurant.vercel.app
